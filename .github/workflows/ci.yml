name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  scaffold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Generate the scaffolder template
        run: node packages/create-next-blogspot/scripts/prepare-template.mjs

      - name: Scaffold into a temporary directory
        run: node packages/create-next-blogspot/index.mjs /tmp/scaffolded --skip-probe

      - name: Install the scaffolded app
        working-directory: /tmp/scaffolded
        run: pnpm install --no-frozen-lockfile

      - name: Build the scaffolded app
        working-directory: /tmp/scaffolded
        run: pnpm build
